<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UnitedSoft Portal - Admin & HR Web Access</title>
  <link rel="stylesheet" href="app.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="login-body">

  <div class="login-card">
    <div style="text-align: center; margin-bottom: 24px;">
      <div class="brand-icon" style="margin: 0 auto 12px auto; width: 48px; height: 48px; font-size: 24px;">
        <i class="fa-solid fa-building-shield"></i>
      </div>
      <h1 style="font-size: 22px; font-weight: 800; color: var(--text-main);">UnitedSoft Technologies</h1>
      <p style="font-size: 13px; color: var(--text-muted); margin-top: 4px;">Cloud Attendance & Workforce Management</p>
    </div>

    <!-- Portal Mode Selector Tabs -->
    <div class="login-tabs">
      <button type="button" class="login-tab active" id="tabAdmin" onclick="switchPortal('ADMIN')">
        <i class="fa-solid fa-shield-halved"></i> Admin Portal
      </button>
      <button type="button" class="login-tab" id="tabHr" onclick="switchPortal('HR')">
        <i class="fa-solid fa-user-tie"></i> HR Portal
      </button>
    </div>

    <div id="portalInfoBanner" style="background: #EEF2FF; border: 1px solid #C7D2FE; border-radius: var(--radius-md); padding: 10px 14px; margin-bottom: 18px; font-size: 12px; color: #4338CA; display: flex; align-items: center; gap: 8px;">
      <i class="fa-solid fa-circle-info"></i>
      <span id="portalInfoText"><strong>Admin Portal:</strong> Web-exclusive management control center for system administrators.</span>
    </div>

    <div id="alertBox" style="display: none; padding: 10px 14px; border-radius: var(--radius-md); font-size: 12.5px; margin-bottom: 16px; font-weight: 600;"></div>

    <form id="loginForm" onsubmit="handleLoginSubmit(event)">
      <div class="form-group">
        <label class="form-label" for="loginInput">Corporate Email / Employee Code</label>
        <div style="position: relative;">
          <input type="text" id="loginInput" class="input-control" placeholder="e.g. admin@unitedsoft.com" required autocomplete="username">
        </div>
      </div>

      <div class="form-group">
        <label class="form-label" for="passInput">Password</label>
        <div style="position: relative;">
          <input type="password" id="passInput" class="input-control" placeholder="••••••••" required autocomplete="current-password">
        </div>
      </div>

      <button type="submit" id="submitBtn" class="btn btn-primary" style="width: 100%; justify-content: center; padding: 12px; margin-top: 8px;">
        <span id="btnText">Sign In to Admin Portal</span>
        <i class="fa-solid fa-arrow-right"></i>
      </button>
    </form>

    <div style="margin-top: 24px; padding-top: 16px; border-top: 1px solid var(--border);">
      <div style="font-size: 11px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; margin-bottom: 8px;">
        Fast-Fill Demo Accounts
      </div>
      <div class="demo-chips">
        <button type="button" class="demo-btn" onclick="fillDemo('admin@unitedsoft.com', 'admin123', 'ADMIN')">
          <i class="fa-solid fa-shield-halved" style="color: var(--primary);"></i> Admin Demo
        </button>
        <button type="button" class="demo-btn" onclick="fillDemo('hr@unitedsoft.com', 'hr123', 'HR')">
          <i class="fa-solid fa-user-tie" style="color: var(--secondary);"></i> HR Demo
        </button>
      </div>
    </div>

    <div style="margin-top: 20px; text-align: center; font-size: 11.5px; color: var(--text-muted);">
      <i class="fa-solid fa-mobile-screen"></i> Employees and Team Leaders: Please use the <strong>UniStaff Mobile App</strong>.
    </div>
  </div>

  <script>
    let currentPortal = 'ADMIN';

    // Auto-redirect if already logged in with valid token
    window.addEventListener('DOMContentLoaded', () => {
      const token = localStorage.getItem('us_token');
      const userStr = localStorage.getItem('us_user');
      if (token && userStr) {
        try {
          const user = JSON.parse(userStr);
          if (user.role === 'ADMIN' || user.role === 'HR_ADMIN') {
            window.location.href = 'admin.html';
          } else if (user.role === 'HR') {
            window.location.href = 'hr.html';
          }
        } catch (e) {}
      }
    });

    function switchPortal(portal) {
      currentPortal = portal;
      const tabAdmin = document.getElementById('tabAdmin');
      const tabHr = document.getElementById('tabHr');
      const infoText = document.getElementById('portalInfoText');
      const infoBanner = document.getElementById('portalInfoBanner');
      const btnText = document.getElementById('btnText');
      const submitBtn = document.getElementById('submitBtn');

      if (portal === 'ADMIN') {
        tabAdmin.classList.add('active');
        tabHr.classList.remove('active');
        infoBanner.style.background = '#EEF2FF';
        infoBanner.style.borderColor = '#C7D2FE';
        infoBanner.style.color = '#4338CA';
        infoText.innerHTML = '<strong>Admin Portal:</strong> Web-exclusive management control center for system administrators.';
        btnText.innerText = 'Sign In to Admin Portal';
        submitBtn.className = 'btn btn-primary';
      } else {
        tabHr.classList.add('active');
        tabAdmin.classList.remove('active');
        infoBanner.style.background = '#F0FDFA';
        infoBanner.style.borderColor = '#99F6E4';
        infoBanner.style.color = '#0F766E';
        infoText.innerHTML = '<strong>HR Portal:</strong> Human Resources management panel plus personal attendance punch-in system.';
        btnText.innerText = 'Sign In to HR Portal';
        submitBtn.className = 'btn btn-secondary';
      }
      clearAlert();
    }

    function fillDemo(email, pass, portal) {
      switchPortal(portal);
      document.getElementById('loginInput').value = email;
      document.getElementById('passInput').value = pass;
    }

    function showAlert(msg, isError = true) {
      const box = document.getElementById('alertBox');
      box.style.display = 'block';
      box.style.background = isError ? 'var(--danger-bg)' : 'var(--success-bg)';
      box.style.color = isError ? 'var(--danger)' : 'var(--success)';
      box.style.border = isError ? '1px solid #FCA5A5' : '1px solid #86EFAC';
      box.innerText = msg;
    }

    function clearAlert() {
      const box = document.getElementById('alertBox');
      box.style.display = 'none';
      box.innerText = '';
    }

    async function handleLoginSubmit(e) {
      e.preventDefault();
      clearAlert();

      const identifier = document.getElementById('loginInput').value.trim();
      const password = document.getElementById('passInput').value;
      const submitBtn = document.getElementById('submitBtn');

      if (!identifier || !password) {
        showAlert('Please enter both Email/Employee Code and Password');
        return;
      }

      submitBtn.disabled = true;
      submitBtn.style.opacity = '0.7';

      try {
        const res = await fetch('/api/auth/login', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            loginId: identifier,
            password: password,
            userType: currentPortal
          })
        });

        const data = await res.json();
        if (!res.ok) {
          throw new Error(data.error || 'Authentication failed');
        }

        const user = data.user;
        const role = user.role;

        // Verify role permissions for Web portal access
        if (role === 'EMPLOYEE' || role === 'TL') {
          throw new Error('Employee & Team Leader accounts are accessible exclusively via the UniStaff Mobile App. Please use the mobile app.');
        }

        if (currentPortal === 'ADMIN' && role !== 'ADMIN' && role !== 'HR_ADMIN') {
          throw new Error('Access Denied: This account is not authorized for Administrator access. Please switch to the HR Portal.');
        }

        // Store session
        localStorage.setItem('us_token', data.token);
        localStorage.setItem('us_user', JSON.stringify(user));

        showAlert('Login successful! Redirecting...', false);

        setTimeout(() => {
          if (role === 'ADMIN' || role === 'HR_ADMIN') {
            window.location.href = 'admin.html';
          } else {
            window.location.href = 'hr.html';
          }
        }, 600);

      } catch (err) {
        showAlert(err.message || 'Login failed. Please check credentials.');
      } finally {
        submitBtn.disabled = false;
        submitBtn.style.opacity = '1';
      }
    }
  </script>
</body>
</html>
